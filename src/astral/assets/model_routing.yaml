policy:
  fallback: class-preserving only; never escalate permissiveness on failure
  refusal: logged as behavior, never retried away; model refusals are data
  refusal_layers: 'provider filter and model judgment are distinct (BioSecBench: most refusals are provider-side API filters
    pre-reasoning); every refusal event in corpus metadata carries its layer'
  agentic: tools on for all tool-bearing routes (modality=agent with grounded biotools)
fallbacks:
  rules:
    mechanical: retry same model up to 2 times, then rotate to the next tier-mate
    provider_filtered: record the event, then rotate to the next tier-mate
    refusal: never fall back; log as behavior and stop
    hard_cell: routes at KC>=6 with SP>=2 go straight to the floor on any failure class
    rotation: within a tier, advance from the failed model by (attempt + 1) seeded by the cycle index, so failures distribute
      across the tier instead of piling onto one alternate
  floor: e2ee-qwen3-6-35b-a3b-uncensored-p
  tiers:
    user_sim:
    - deepseek/deepseek-v4-flash
    - google/gemini-3.5-flash-lite
    - z-ai/glm-5.2
    - google/gemini-3.6-flash
    target_refusal_frontier:
    - anthropic/claude-sonnet-4.6
    - anthropic/claude-opus-4.8
    target_boundary:
    - google/gemini-3.5-flash
    - qwen/qwen3.7-max
    target_permissive:
    - google/gemini-2.5-pro
    - google/gemini-2.5-flash
    - deepseek/deepseek-v4-pro
    - deepseek/deepseek-v4-flash
